name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  webstack:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: calculatietool
          POSTGRES_PASSWORD: calculatietool
          POSTGRES_DB: calculatietool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calculatietool -d calculatietool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CALCULATIETOOL_ENV: local
      CALCULATIETOOL_BACKEND_STORAGE_PROVIDER: postgres
      CALCULATIETOOL_POSTGRES_HOST: 127.0.0.1
      CALCULATIETOOL_POSTGRES_PORT: "5432"
      CALCULATIETOOL_POSTGRES_DB: calculatietool
      CALCULATIETOOL_POSTGRES_USER: calculatietool
      CALCULATIETOOL_POSTGRES_PASSWORD: calculatietool
      # Playwright uses the local temp admin in local env
      TEST_USERNAME: admin
      TEST_PASSWORD: admin
      BASE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Bootstrap database (seed)
        run: |
          python scripts/bootstrap_postgres.py

      - name: Backend unit tests
        run: |
          python scripts/check_unittest_discovery.py
          python -m unittest discover -s tests

      - name: Start backend
        run: |
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend-ci.log 2>&1 &

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend lint/build/pricing
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm run test:pricing

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run dev -- -p 3000 > ../frontend-ci.log 2>&1 &

      - name: Wait for web
        run: |
          python - <<'PY'
          import time, urllib.request
          url = "http://127.0.0.1:3000/login"
          for i in range(60):
            try:
              with urllib.request.urlopen(url, timeout=2) as r:
                if r.status == 200:
                  print("OK")
                  raise SystemExit(0)
            except Exception:
              time.sleep(1)
          raise SystemExit("Timeout waiting for frontend")
          PY

      - name: RF-002 auth role visibility
        working-directory: frontend
        run: npx playwright test tests/e2e/auth.permissions.spec.ts --retries=0

      # RF-001 records E2E results, but RF-003 must establish the guarded,
      # disposable-data harness before these tests become a blocking gate.
      - name: Playwright (non-blocking until RF-003)
        continue-on-error: true
        working-directory: frontend
        run: npx playwright test

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            backend-ci.log
            frontend-ci.log

